# EC2-host nginx — the ONLY thing CloudFront's /api origin talks to. Reverse-proxies to the backend
# container (127.0.0.1:8081) and REJECTS anything that didn't arrive through CloudFront, so hitting the
# EC2's public IP directly is blocked (#63 — no bypass of CloudFront's CSP/rate-limits/WAF).
#
# Deploy: put this at /etc/nginx/conf.d/backend.conf on the EC2. Replace the secret below with a long
# random value, and set the SAME value as a CloudFront origin custom header `X-Origin-Verify`.
# (The frontend is served by S3/CloudFront, NOT nginx — this host only fronts the API.)

server {
    listen 80 default_server;
    server_name _;

    # --- CloudFront-only gate ---
    # CloudFront adds X-Origin-Verify on origin requests; a direct-to-IP hit won't have it → 403.
    if ($http_x_origin_verify != "REPLACE_WITH_LONG_RANDOM_SECRET") {
        return 403;
    }

    # App caps JSON at 1mb. The ceiling here is set by image upload (/api/upload/poster, 20mb) —
    # a phone photo of a printed poster is 8-15mb and a 200MP shot up to 25mb. Multer enforces the cap
    # and returns a clean JSON 400; nginx only needs enough headroom to let the request reach it,
    # otherwise the proxy 413s first with an HTML error page the SPA can't parse.
    client_max_body_size 21m;

    # ── Slow-request (slowloris / RUDY) timeouts ─────────────────────────────
    # nginx defaults both of these to 60s, which is the whole attack: a handful of connections that
    # dribble one header byte every 59s hold worker slots open indefinitely and cost the attacker
    # nothing. The X-Origin-Verify gate above does NOT help — nginx must finish reading the request
    # headers before it can test one, so a slow-header attack never reaches the check. That matters
    # because the security group opens port 80 to 0.0.0.0/0, so this is reachable directly on the
    # EC2's public DNS, bypassing CloudFront entirely.
    #
    # Both are IDLE timeouts between successive reads, not a total budget for the request — a 20MB
    # poster upload over congested campus wifi is unaffected, because it only ever needs to deliver
    # SOME bytes within the window, not all of them.
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          30s;

    # NOTE: deliberately no limit_conn here. Behind CloudFront, $binary_remote_addr is the EDGE's
    # address, not the student's — every user in a region collapses into one key, exactly the bug
    # that made the app's per-IP write limiter a single global bucket (see app.js `trust proxy`).
    # A connection cap keyed on that would throttle real traffic and still not bound an attacker who
    # spreads across edges. The timeouts above are the fix that actually applies here; the structural
    # one is locking the security group to CloudFront's origin-facing prefix list.

    # health check can skip the origin-verify gate if you point an internal check at it — but UptimeRobot
    # comes THROUGH CloudFront, so it carries the header and passes the gate normally.

    # CloudFront routes /api/* here. The SPA calls the API as /api/... (same-origin); strip that prefix
    # so it maps to the backend's real routes (/events, /oauth, /health, …). The trailing slash on
    # proxy_pass does the strip: /api/events/all → /events/all. UptimeRobot hits /api/health.
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CloudFront terminates TLS and talks to us over http — tell the app the original was https so
        # `trust proxy` marks cookies Secure and req.protocol is correct.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
