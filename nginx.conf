server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # API is SAME-ORIGIN here, exactly as it is behind CloudFront in production. Without this the SPA
    # would need an absolute cross-origin URL baked in at build time (the old VITE_API_URL), which
    # meant dev, self-hosted and production each had different cookie/CORS behaviour — so a login bug
    # could only ever show up in one of them. The trailing slash on proxy_pass strips the /api prefix:
    # /api/events/all -> /events/all, matching the backend's real routes.
    #
    # `backend` is the docker-compose service name; Docker's internal DNS resolves it.
    location /api/ {
        proxy_pass http://backend:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image upload posts multipart bodies; the app caps posters at 20mb (see routes/upload.js).
        # nginx's 1m default would 413 them here, before multer could return a clean JSON error.
        client_max_body_size 21m;
    }

    # React Router v7 SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
